services:
  wendy-translator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wendy-translator
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据库文件
      - ./database:/app/database
      # 可选：如果需要热更新前端文件
      # - ./frontend:/app/frontend:ro
    environment:
      # 时区：容器默认为 UTC，这里设为北京时间（日志与接口时间才与本地一致）
      - TZ=${TZ:-Asia/Shanghai}
      # Flask 配置
      - FLASK_ENV=production
      - FLASK_APP=backend/core/app.py
      # 关闭调试模式，避免 Werkzeug 调试器在生产环境暴露
      - FLASK_DEBUG=false
      # 数据库路径
      - DATABASE_PATH=/app/database/wendy_translator.db
      
      # 翻译 API 配置（可选，通过环境变量配置）
      - BAIDU_APPID=${BAIDU_APPID:-}
      - BAIDU_SECRET=${BAIDU_SECRET:-}
      - YOUDAO_APPKEY=${YOUDAO_APPKEY:-}
      - YOUDAO_SECRET=${YOUDAO_SECRET:-}
      # 翻译服务优先级（可选）：youdao 或 baidu，默认优先使用有道
      - TRANSLATION_SERVICE=${TRANSLATION_SERVICE:-}
      
      # DeepSeek API 配置（可选）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      
      # 百度语音识别 API（可选）
      - BAIDU_SPEECH_APP_ID=${BAIDU_SPEECH_APP_ID:-}
      - BAIDU_SPEECH_API_KEY=${BAIDU_SPEECH_API_KEY:-}
      - BAIDU_SPEECH_SECRET_KEY=${BAIDU_SPEECH_SECRET_KEY:-}
      
      # 百度 OCR API（可选）
      - BAIDU_OCR_API_KEY=${BAIDU_OCR_API_KEY:-}
      - BAIDU_OCR_SECRET_KEY=${BAIDU_OCR_SECRET_KEY:-}

      # Pixabay 图片 API（可选，单词配图 / 记忆图片功能）
      - PIXABAY_API_KEY=${PIXABAY_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wendy-network

networks:
  wendy-network:
    driver: bridge

volumes:
  database-data:
    driver: local

