# 温蒂翻译助手 —— HTTPS 前端
#
# 作用：给局域网里的手机提供一个「可信的 HTTPS 地址」。
# 为什么需要：Service Worker / PWA 安装要求安全上下文，
#   纯 HTTP 的局域网 IP（http://192.168.3.5:5000）会被浏览器拒绝。
#
# 架构：
#   手机  --https://192.168.3.5:5443-->  nginx(本容器，TLS 终止)
#                                          |
#                                          +--http--> wendy-translator:5000 (Flask)
#
# 电脑上的 http://localhost:5000 保持原样不变，互不影响。

worker_processes 1;

error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;

    # 语音识别上传音频、OCR 上传图片，留足空间
    client_max_body_size 25m;

    # 隐藏 nginx 版本号
    server_tokens off;

    # Docker 内置 DNS 服务器。
    # 必须配：nginx 默认只在启动时把 proxy_pass 里的主机名解析一次并永久缓存。
    # 应用容器一旦重建、IP 变了，nginx 就会一直 502，直到 nginx 自己重启。
    # 配合下面用变量写 proxy_pass，让它按 valid=10s 定期重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen      443 ssl;
        server_name 192.168.3.5;

        ssl_certificate     /etc/nginx/certs/wendy-fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/wendy.key;

        # Android 8+ 与桌面浏览器都支持 TLS 1.2/1.3
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:2m;
        ssl_session_timeout 1h;

        location / {
            # 用变量写，配合上面的 resolver 实现运行时重新解析（见 resolver 注释）
            set $wendy_upstream http://wendy-translator:5000;
            proxy_pass $wendy_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # 翻译 / DeepSeek 对话可能较慢，别过早断开
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
